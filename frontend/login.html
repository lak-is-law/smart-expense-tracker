<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Smart Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(18, 26, 43, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            --primary-hover: linear-gradient(135deg, #60a5fa 0%, #1d4ed8 100%);
            --input-bg: #0f172a;
            --input-border: rgba(255, 255, 255, 0.14);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-border: rgba(239, 68, 68, 0.4);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: rgba(16, 185, 129, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 10%, #1e293b 0%, #090d16 100%);
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
            top: 10%;
            left: 15%;
            pointer-events: none;
            filter: blur(50px);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12), transparent 70%);
            bottom: 10%;
            right: 15%;
            pointer-events: none;
            filter: blur(50px);
            z-index: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.25rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 
                        0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .app-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .app-brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.35);
        }

        .app-brand-icon i {
            color: #fff;
            font-size: 1.2rem;
        }

        .app-brand-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tab-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(15, 23, 42, 0.85);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .tab-btn {
            padding: 0.65rem 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(30, 41, 59, 0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .auth-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
            color: #fff;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.825rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            color: #64748b;
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.6rem;
            background: var(--input-bg) !important;
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            color: #f8fafc !important;
            font-family: inherit;
            font-size: 0.925rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: #475569;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: #0f172a !important;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--primary);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #0f172a inset !important;
            -webkit-text-fill-color: #f8fafc !important;
            caret-color: #f8fafc !important;
            border-color: var(--input-border) !important;
            transition: background-color 50000s ease-in-out 0s;
        }

        input:-webkit-autofill:focus {
            border-color: var(--primary) !important;
            -webkit-box-shadow: 0 0 0 1000px #0f172a inset, 0 0 0 3px rgba(56, 189, 248, 0.2) !important;
        }

        .password-toggle {
            position: absolute;
            right: 0.85rem;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #cbd5e1;
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.25rem 0;
            color: #475569;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--card-border);
        }

        .divider span {
            padding: 0 0.75rem;
        }

        .google-auth-box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 44px;
        }

        .auth-alert {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            line-height: 1.45;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: #fca5a5;
        }

        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #86efac;
        }

        .alert-content {
            display: flex;
            align-items: flex-start;
            gap: 0.65rem;
        }

        .alert-content i {
            margin-top: 2px;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .alert-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 0.45rem;
            padding: 0.35rem 0.75rem;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 6px;
            color: #38bdf8;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .alert-action-btn:hover {
            background: rgba(56, 189, 248, 0.35);
            transform: translateY(-1px);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 1.75rem 1.25rem;
                border-radius: 16px;
            }
            .auth-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" id="cardContainer">
            <!-- App Brand Header -->
            <div class="app-brand">
                <div class="app-brand-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <span class="app-brand-name">Smart Expense Tracker</span>
            </div>

            <!-- Tab Switcher -->
            <div class="tab-switcher">
                <button type="button" class="tab-btn active" id="signInTabBtn" onclick="switchAuthTab('login')">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <button type="button" class="tab-btn" id="signUpTabBtn" onclick="switchAuthTab('signup')">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </div>

            <!-- Global Alert Container -->
            <div class="auth-alert" id="authAlert">
                <div class="alert-content">
                    <i class="fas fa-exclamation-circle" id="alertIcon"></i>
                    <div id="alertMessageWrapper">
                        <span id="alertText"></span>
                        <div id="alertActionWrapper"></div>
                    </div>
                </div>
            </div>

            <!-- SIGN IN VIEW -->
            <div id="loginSection">
                <div class="auth-header">
                    <h2 class="auth-title">Welcome Back</h2>
                    <p class="auth-subtitle">Enter your credentials to access your dashboard</p>
                </div>

                <form id="loginForm" autocomplete="on">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="loginEmail" class="form-input" required placeholder="you@example.com" autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••" autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="loginBtn">
                        <i class="fas fa-arrow-right-to-bracket"></i> Sign In
                    </button>
                </form>

                <div class="divider">
                    <span>or continue with</span>
                </div>

                <div class="google-auth-box">
                    <div id="googleBtnLogin"></div>
                </div>
            </div>

            <!-- SIGN UP VIEW -->
            <div id="signupSection" style="display: none;">
                <div class="auth-header">
                    <h2 class="auth-title">Create Account</h2>
                    <p class="auth-subtitle">Track smarter and get AI insights on your finances</p>
                </div>

                <form id="signupForm" autocomplete="on">
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="signupName" class="form-input" required placeholder="John Doe" autocomplete="name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="signupEmail" class="form-input" required placeholder="you@example.com" autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="signupPassword" class="form-input" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password">
                            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signupPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="signupBtn">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>

                <div class="divider">
                    <span>or sign up with</span>
                </div>

                <div class="google-auth-box">
                    <div id="googleBtnSignup"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const GOOGLE_CLIENT_ID = '941885758128-10b0d2830m69b6dqloa49srm6g7d7a9i.apps.googleusercontent.com';

        // Robust API URL Resolution
        function getApiBase() {
            try {
                if (
                    !window.location.origin ||
                    window.location.origin === 'null' ||
                    window.location.protocol === 'file:' ||
                    window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1' ||
                    window.location.port !== ''
                ) {
                    return 'http://localhost:3000';
                }
                return window.location.origin.replace(/\/+$/, '') + '/api';
            } catch (_) {
                return 'http://localhost:3000';
            }
        }

        const API_BASE = getApiBase();

        function switchAuthTab(mode) {
            hideAlert();
            const isLogin = mode === 'login';
            
            document.getElementById('signInTabBtn').classList.toggle('active', isLogin);
            document.getElementById('signUpTabBtn').classList.toggle('active', !isLogin);
            
            document.getElementById('loginSection').style.display = isLogin ? 'block' : 'none';
            document.getElementById('signupSection').style.display = isLogin ? 'none' : 'block';
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showAlert(message, type = 'error', action = null) {
            const alertBox = document.getElementById('authAlert');
            const alertText = document.getElementById('alertText');
            const alertIcon = document.getElementById('alertIcon');
            const actionWrapper = document.getElementById('alertActionWrapper');
            const card = document.getElementById('cardContainer');

            alertBox.className = `auth-alert ${type === 'success' ? 'alert-success' : 'alert-error'}`;
            alertIcon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-triangle';
            alertText.innerHTML = message;
            actionWrapper.innerHTML = '';

            if (action) {
                const actionBtn = document.createElement('button');
                actionBtn.className = 'alert-action-btn';
                actionBtn.innerHTML = `${action.text} <i class="fas fa-arrow-right"></i>`;
                actionBtn.onclick = action.callback;
                actionWrapper.appendChild(actionBtn);
            }

            alertBox.style.display = 'block';

            if (type === 'error' && card) {
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
            }
        }

        function hideAlert() {
            const alertBox = document.getElementById('authAlert');
            if (alertBox) alertBox.style.display = 'none';
        }

        // Initialize Google Sign-In Programmatically
        function initGoogleIdentity() {
            if (window.google && google.accounts && google.accounts.id) {
                try {
                    google.accounts.id.initialize({
                        client_id: GOOGLE_CLIENT_ID,
                        callback: handleGoogleSignIn,
                        auto_select: false,
                        cancel_on_tap_outside: true
                    });

                    const loginTarget = document.getElementById('googleBtnLogin');
                    if (loginTarget) {
                        google.accounts.id.renderButton(loginTarget, {
                            theme: 'filled_blue',
                            size: 'large',
                            shape: 'pill',
                            text: 'signin_with',
                            width: 320,
                            logo_alignment: 'left'
                        });
                    }

                    const signupTarget = document.getElementById('googleBtnSignup');
                    if (signupTarget) {
                        google.accounts.id.renderButton(signupTarget, {
                            theme: 'filled_blue',
                            size: 'large',
                            shape: 'pill',
                            text: 'signup_with',
                            width: 320,
                            logo_alignment: 'left'
                        });
                    }
                } catch (e) {
                    console.warn('Google Identity initialization error:', e);
                }
            } else {
                setTimeout(initGoogleIdentity, 200);
            }
        }

        window.addEventListener('load', () => {
            initGoogleIdentity();
        });

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const btn = document.getElementById('loginBtn');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert('Please enter both your email address and password.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json().catch(() => ({ error: 'Invalid response from server' }));

                if (!res.ok) {
                    if (data.code === 'USER_NOT_FOUND' || res.status === 404) {
                        showAlert(
                            `<strong>Account not found!</strong> No user is registered with <code>${email}</code>.`,
                            'error',
                            {
                                text: 'Create Account with this Email',
                                callback: () => {
                                    switchAuthTab('signup');
                                    document.getElementById('signupEmail').value = email;
                                    document.getElementById('signupName').focus();
                                }
                            }
                        );
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
                        return;
                    }

                    if (data.code === 'GOOGLE_AUTH_REQUIRED') {
                        showAlert(data.error || 'This account uses Google Sign-In.');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
                        return;
                    }

                    if (data.code === 'INVALID_PASSWORD') {
                        showAlert('<strong>Incorrect password.</strong> Please double-check your password.');
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
                        return;
                    }

                    throw new Error(data.error || 'Login failed');
                }

                showAlert('Sign in successful! Redirecting...', 'success');
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('authUser', JSON.stringify(data.user));
                setTimeout(() => { window.location.href = 'index.html'; }, 600);

            } catch (err) {
                const msg = (err.message && !err.message.includes('pattern') && !err.message.includes('fetch')) 
                    ? err.message 
                    : 'Could not connect to backend server. Please make sure the backend is running (run: npm start).';
                showAlert(msg);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
            }
        });

        // Signup Handler
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const btn = document.getElementById('signupBtn');
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            if (!name || !email || !password) {
                showAlert('Please fill in all required fields.');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

            try {
                const res = await fetch(`${API_BASE}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json().catch(() => ({ error: 'Invalid response from server' }));

                if (!res.ok) {
                    if (res.status === 409) {
                        showAlert(
                            `<strong>Account already exists!</strong> An account with <code>${email}</code> is already registered.`,
                            'error',
                            {
                                text: 'Sign In Instead',
                                callback: () => {
                                    switchAuthTab('login');
                                    document.getElementById('loginEmail').value = email;
                                    document.getElementById('loginPassword').focus();
                                }
                            }
                        );
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                        return;
                    }
                    throw new Error(data.error || 'Signup failed');
                }

                showAlert('🎉 Account created successfully! Launching dashboard...', 'success');
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('authUser', JSON.stringify(data.user));
                setTimeout(() => { window.location.href = 'index.html'; }, 800);

            } catch (err) {
                const msg = (err.message && !err.message.includes('pattern') && !err.message.includes('fetch'))
                    ? err.message
                    : 'Could not connect to backend server. Please make sure the backend is running (run: npm start).';
                showAlert(msg);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });

        // Google Sign In Handler
        async function handleGoogleSignIn(response) {
            if (!response || !response.credential) {
                showAlert('Google authentication was cancelled or failed.');
                return;
            }

            try {
                showAlert('Verifying Google credentials...', 'success');
                const res = await fetch(`${API_BASE}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: response.credential })
                });

                const data = await res.json().catch(() => ({ error: 'Google verification failed' }));
                if (!res.ok) throw new Error(data.error || 'Google token verification failed');

                showAlert('Google Sign-In successful! Loading dashboard...', 'success');
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('authUser', JSON.stringify(data.user));
                setTimeout(() => { window.location.href = 'index.html'; }, 600);
            } catch (err) {
                const msg = (err.message && !err.message.includes('pattern') && !err.message.includes('fetch'))
                    ? err.message
                    : 'Could not connect to backend server for Google verification. Please start the server (run: npm start).';
                showAlert(msg);
            }
        }

        if (localStorage.getItem('authToken')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
